<style>
:root{color-scheme:dark;--g:#f4c15a;--ink:#fff3de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#12040c;color:var(--ink);font:400 15px Inter,system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;overflow:hidden}.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.5;animation:dr 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#c2410c;left:-30vmax;top:-25vmax}.bg i:nth-child(2){background:#9d174d;right:-35vmax;top:20vh;animation-delay:-6s}.bg i:nth-child(3){background:#4c1d95;left:-10vmax;bottom:-45vmax;animation-delay:-11s}

canvas{position:fixed;inset:0;pointer-events:none;z-index:6}
#app{position:relative;z-index:3;height:100%;display:flex;flex-direction:column}
#art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:34px 10px 6px;transition:all .8s}
#art>svg{height:100%;max-width:100%}
.col{display:flex;flex-direction:column;align-items:center;height:100%;min-height:0;position:relative}.col>svg{flex:1;min-height:0;max-width:100%}

.out #art{opacity:0;filter:blur(12px);transform:scale(1.12)}.out #sheet{opacity:0;transform:translateY(40px)}
#k{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--g)}
#t{font:italic 600 32px/1.1 'Cormorant Garamond',serif;margin:6px 0}
#p{margin:0 auto 12px;max-width:36ch;opacity:.85;line-height:1.5;font-size:14px;min-height:20px}
button{font:600 13px Inter;letter-spacing:.14em;text-transform:uppercase;border:0;border-radius:50px;padding:15px 26px;width:100%;color:#2a0d00;background:linear-gradient(135deg,#ffe8a8,#e5a93f 55%,#b8791a);box-shadow:0 10px 30px #f4c15a44;cursor:pointer;transition:transform .2s}

.it{position:absolute;transform-style:preserve-3d;animation:drop 1s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{from{transform:translateZ(300px) scale(1.4);opacity:0}}
.thali{inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f9dd85,#d9a032 58%,#fbe9a8 61%,#a46c12 66%,#e8c05a 72%,#6b3c06);box-shadow:0 36px 40px #000c,inset 0 0 0 4px #ffe9a3;animation:none}
.thali:before{content:"";position:absolute;inset:30px;border:2px dashed #8a58104d;border-radius:50%}.thali:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,#fff5 7%,transparent 18%,transparent 52%,#fff4 60%,transparent 72%)}
.bowl{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d39a2b 55%,#6a3d05);box-shadow:0 10px 14px #000b}.bowl b{position:absolute;inset:9px;border-radius:50%}.bowl u{position:absolute;left:44%;top:44%;border-radius:50%;text-decoration:none}
